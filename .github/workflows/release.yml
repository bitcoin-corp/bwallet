name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build, package, and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/build-extension

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/pw-*.zip

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.ref_name }}
          path: release/
          if-no-files-found: error

  reproduce:
    name: Reproduce on a fresh runner
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/build-extension

      - name: Download the first build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.ref_name }}
          path: expected

      - name: Compare with the first build
        run: |
          set -euo pipefail
          zip=$(basename release/pw-*.zip)
          if ! diff -u expected/SHA256SUMS release/SHA256SUMS; then
            echo "::error::Build output differs between two clean runners. The build is not reproducible."
            exit 1
          fi
          if ! cmp -s "expected/$zip" "release/$zip"; then
            echo "::error::File contents match but the zip differs. Packaging is not deterministic."
            exit 1
          fi
          hash=$(cut -d' ' -f1 "release/$zip.sha256")
          echo "Reproduced $zip byte-for-byte: $hash"
          {
            echo "### Reproducibility check passed"
            echo
            echo "A second clean runner rebuilt \`$zip\` byte-for-byte (\`$hash\`)."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Draft GitHub release
    needs: [build, reproduce]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.ref_name }}
          path: release

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          zip=$(basename release/pw-*.zip)
          hash=$(cut -d' ' -f1 "release/$zip.sha256")
          extra=""
          case "$RELEASE_TAG" in *-*) extra="--prerelease" ;; esac

          gh release create "$RELEASE_TAG" \
            "release/$zip" "release/$zip.sha256" release/SHA256SUMS \
            --draft $extra --verify-tag --generate-notes --title "Release $RELEASE_TAG"

          notes=$(gh release view "$RELEASE_TAG" --json body --jq .body)
          {
            printf '%s\n\n' "$notes"
            printf '## Verify this release\n\n'
            printf 'Built by GitHub Actions from %s.\n\n' "$GITHUB_SHA"
            printf '`%s` sha256: `%s`\n\n' "$zip" "$hash"
            printf '```sh\nsha256sum -c %s.sha256\ngh attestation verify %s --repo %s\n```\n\n' "$zip" "$zip" "$GITHUB_REPOSITORY"
            printf 'To rebuild from source and compare, see [docs/releasing.md](https://github.com/%s/blob/%s/docs/releasing.md#verifying-a-release).\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG"
          } > notes.md
          gh release edit "$RELEASE_TAG" --notes-file notes.md

          echo "Drafted $(gh release view "$RELEASE_TAG" --json url --jq .url)"
