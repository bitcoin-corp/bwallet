name: Money guard

# Pull requests that touch key, password, keystore, backup or restore code (.github/money-paths.txt)
# need the owner's `money-ok` label. The known-answer tests in src/moneyGuard run in CI with the rest (pnpm test).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  guard:
    name: Money guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Money paths need the money-ok label
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          grep -vE '^(#|$)' .github/money-paths.txt > "$RUNNER_TEMP/paths"
          hits=$(git diff --name-only "$BASE...$HEAD" | grep -E -f "$RUNNER_TEMP/paths" || true)
          if [ -z "$hits" ]; then echo "No money code touched."; exit 0; fi
          echo "Money code touched:"; echo "$hits"
          case ",$LABELS," in
            *,money-ok,*) echo "money-ok label present." ;;
            *) echo "::error::This pull request changes money code. The owner must review it and add the money-ok label."; exit 1 ;;
          esac
