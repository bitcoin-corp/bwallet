name: Build extension
description: Install the pinned toolchain (pnpm; bun for tests), then check, test, build, verify, and package the extension into release/

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 12.11.1

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Set up Bun (test runner)
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .bun-version

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Check formatting
      shell: bash
      run: pnpm run format:check

    - name: Typecheck
      shell: bash
      run: pnpm run typecheck

    - name: Lint
      shell: bash
      run: pnpm run lint --max-warnings 0

    - name: Test
      shell: bash
      run: pnpm test

    - name: Build
      shell: bash
      run: pnpm run build

    - name: Verify build output
      shell: bash
      run: pnpm run verify:build

    - name: Package
      shell: bash
      run: pnpm run package
