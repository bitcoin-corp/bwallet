apply plugin: 'com.android.application'

android {
    buildFeatures {
        buildConfig true
    }
    namespace = "org.yours.wallet"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.bitcoincorp.bwallet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 129
        versionName "5.2.40"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing: scripts/channel-build.sh supplies these from the macOS
    // Keychain at build time. Nothing secret lives in the repo.
    signingConfigs {
        release {
            if (System.getenv("YOURS_UPLOAD_KEYSTORE")) {
                storeFile file(System.getenv("YOURS_UPLOAD_KEYSTORE"))
                storePassword System.getenv("YOURS_UPLOAD_PASSWORD")
                keyAlias "upload"
                keyPassword System.getenv("YOURS_UPLOAD_PASSWORD")
            }
        }
    }
    // Release channels (src/mobile/channel.ts). play keeps the original ID; direct (the APK from the
    // site) has its own ID and name so both install side by side. Build with scripts/channel-build.sh,
    // which puts the matching web bundle in place first.
    flavorDimensions = ["channel"]
    productFlavors {
        play {
            dimension "channel"
            buildConfigField "String", "CHANNEL", '"android-play"'
        }
        direct {
            dimension "channel"
            applicationIdSuffix ".direct"
            versionNameSuffix "-direct"
            buildConfigField "String", "CHANNEL", '"android-direct"'
        }
    }
    buildTypes {
        release {
            if (System.getenv("YOURS_UPLOAD_KEYSTORE")) signingConfig signingConfigs.release
            minifyEnabled false
            // Ship native debug symbols in the AAB so Play can symbolicate native crashes (Play warned on 5.1.76).
            ndk { debugSymbolLevel 'SYMBOL_TABLE' }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // YoursNativePlugin: biometric unlock and dApp browser provider injection.
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    // Passkeys with PRF (PasskeysPlugin.java). play-services-auth backs Credential Manager on Android 9-13.
    implementation "androidx.credentials:credentials:1.5.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.5.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
